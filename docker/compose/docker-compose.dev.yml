version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: postgres_music_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ../postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../postgres/init-schema.sql:/docker-entrypoint-initdb.d/02-init-schema.sql

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
